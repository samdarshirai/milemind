spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:runcoach;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

runcoach:
  security:
    jwt:
      issuer: runcoach-backend-test
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 30
      secret: test-secret-change-me-test-secret-change-me-1234567890
