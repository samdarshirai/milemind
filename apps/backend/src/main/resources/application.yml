spring:
  application:
    name: runcoach-backend
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/runcoach
    username: runcoach
    password: runcoach
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      race_goal_active_unique_columns: "user_id"
      race_goal_active_unique_predicate: "WHERE status = 'ACTIVE'"

management:
  endpoints:
    web:
      exposure:
        include: health,info

runcoach:
  security:
    jwt:
      issuer: runcoach-backend
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 30
      secret: change-me-in-real-env-change-me-in-real-env-1234567890
