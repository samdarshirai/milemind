spring:
  application:
    name: runcoach-backend
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/runcoach
    username: runcoach
    password: runcoach
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
