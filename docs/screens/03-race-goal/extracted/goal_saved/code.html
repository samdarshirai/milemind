<style>
    body {
      background-color: #fbf9f8;
      color: #1b1c1c;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .success-gradient {
      background: linear-gradient(180deg, rgba(200, 246, 249, 0.4) 0%, rgba(251, 249, 248, 0) 100%);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col min-h-screen">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-lg h-16 bg-surface dark:bg-deep-canvas border-b border-hairline-light dark:border-hairline-dark">
<div class="flex items-center gap-md">
<button class="p-sm rounded-full hover:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined text-primary dark:text-on-primary">arrow_back</span>
</button>
<h1 class="font-display-md text-display-md font-bold text-primary dark:text-on-primary">Milemind</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary dark:text-on-primary">account_circle</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col pt-16 pb-20 overflow-hidden">
<!-- Hero Success Section -->
<section class="success-gradient flex-grow flex flex-col items-center justify-center px-lg text-center">
<div class="relative mb-3xl">
<!-- Abstract Success Ring Interaction -->
<div class="absolute inset-0 scale-150 bg-mint-accent opacity-20 blur-3xl rounded-full"></div>
<div class="relative w-20 h-20 bg-primary rounded-full flex items-center justify-center animate-bounce duration-[2000ms]">
<span class="material-symbols-outlined text-on-primary text-[40px]" style="font-variation-settings: 'wght' 600;">check</span>
</div>
</div>
<div class="max-w-[320px] space-y-md">
<h2 class="font-display-xl text-display-xl tracking-tight">Race goal saved</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Next, we’ll generate your training plan using your profile, availability, and race goal.</p>
</div>
</section>
<!-- Technical Details Band -->
<section class="bg-primary text-on-primary py-3xl px-lg">
<div class="space-y-lg">
<div class="flex items-center gap-md opacity-60">
<span class="font-eyebrow-mono text-eyebrow-mono uppercase tracking-widest">Initialization Sequence</span>
<div class="flex-grow h-px bg-hairline-dark"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="p-lg border border-hairline-dark rounded-lg flex flex-col gap-xs">
<span class="font-caption-mono text-caption-mono text-mint-accent">METRIC PROFILE</span>
<span class="font-body-md text-body-md">Optimized</span>
</div>
<div class="p-lg border border-hairline-dark rounded-lg flex flex-col gap-xs">
<span class="font-caption-mono text-caption-mono text-mint-accent">ALGORITHM</span>
<span class="font-body-md text-body-md">V02 Max Sync</span>
</div>
</div>
<div class="flex items-center justify-between p-lg bg-surface-soft rounded-lg">
<div class="flex items-center gap-md">
<div class="w-2 h-2 rounded-full bg-mint-accent animate-pulse"></div>
<span class="font-button-mono text-button-mono text-on-primary">Ready to synthesize...</span>
</div>
</div>
</div>
</section>
<!-- Fixed Action Section -->
<div class="px-lg pb-3xl pt-xl bg-surface">
<button class="w-full bg-primary text-on-primary py-xl rounded-full font-button-mono text-button-mono active:scale-95 transition-transform duration-150">
        Continue
      </button>
</div>
</main>
<!-- Wordmark Banner Footer -->
<footer class="bg-surface flex justify-center pb-section-gap overflow-hidden pointer-events-none">
<span class="text-[120px] font-display-xl text-surface-container-highest font-extrabold select-none leading-none -mb-12">MILEMIND</span>
</footer>
<!-- No Bottom Nav on Success Screen per "Destination Rule" & Suppression Logic -->
<script>
    // Micro-interaction for the synthesis text
    const textElement = document.querySelector('.font-button-mono.text-on-primary');
    const messages = ["Ready to synthesize...", "Calculating taper periods...", "Mapping hill repeats...", "Finalizing your plan..."];
    let index = 0;
    
    if (textElement) {
      setInterval(() => {
        index = (index + 1) % messages.length;
        textElement.style.opacity = 0;
        setTimeout(() => {
          textElement.textContent = messages[index];
          textElement.style.opacity = 1;
        }, 300);
      }, 3000);
    }
  </script>
