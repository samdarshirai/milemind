<script>
        // Atmospheric loading effect - subtle flicker or timing logic
        document.addEventListener('DOMContentLoaded', () => {
            const skeletons = document.querySelectorAll('.skeleton-shimmer, .skeleton-shimmer-light');
            
            // Randomly offset animation delays to look more natural
            skeletons.forEach(skel => {
                skel.style.animationDelay = `${Math.random() * 2}s`;
            });
        });
