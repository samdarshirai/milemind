<style>
        body {
            background-color: #fbf9f8;
            color: #1b1c1c;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chrome-gradient {
            background: linear-gradient(90deg, #fc4c02 0%, #ef2cc1 50%, #bdbbff 100%);
        }
        .soft-elevation {
            box-shadow: rgba(1, 1, 32, 0.1) 0px 4px 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-canvas-dark dark:bg-canvas-dark text-on-primary dark:text-on-primary border-b border-hairline-on-dark flex justify-between items-center h-16 px-xl w-full">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-primary" data-icon="analytics">analytics</span>
<h1 class="font-display-md text-display-md uppercase tracking-tight">PLAN</h1>
</div>
<div class="flex items-center gap-md">
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-primary" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-xl pt-16 pb-20 bg-surface-container-lowest">
<div class="max-w-md w-full text-center space-y-2xl">
<!-- Illustration Placeholder -->
<div class="relative w-full aspect-square max-w-[280px] mx-auto overflow-hidden rounded-xl border border-hairline">
<img alt="Minimalist abstract training plan illustration" class="w-full h-full object-cover grayscale opacity-90" data-alt="A minimalist and technical digital illustration of a running track morphing into a complex data grid. The aesthetic is clean and research-oriented, utilizing a strict palette of ink black, clinical white, and subtle periwinkle highlights. The scene is illuminated by sharp, cool studio lighting that emphasizes structural lines and geometric precision. The mood is expectant and professional, perfectly suited for an elite athletic performance application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDcdoe8S25HiYqmCITJbXITvslwEBX6t6ui2h0UFLpjWy56Wy8seqEqRjXHS4anptulBzy8u58KZ5UEN8MNL21KGTG375VBCFc5L9OIuCXsFZMIHQPAILIWU22iDTGRg52qlIHGOAp11g-nOohFJOmqXg1ML2p8G_1TKKn4fuLO_tWhXbsfDOlY9K9NZyFFqcrbUFjfmyntKDnwyhkEXBtOWiy8_f87ZDYzu-IxlY5q40cPxtnnnWca_UyJTeN3Yqr2NjWrkGme1cmW"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/40 to-transparent"></div>
</div>
<!-- Content Group -->
<div class="space-y-lg">
<h2 class="font-display-lg text-display-lg text-ink">No training plan yet</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                    To see your personalized marathon or half marathon plan, you first need to complete onboarding.
                </p>
</div>
<!-- CTA -->
<button class="w-full max-w-[280px] bg-ink text-on-primary font-mono-button text-mono-button py-lg rounded-full uppercase tracking-widest active:scale-[0.98] transition-all soft-elevation">
                Create training plan
            </button>
<!-- Decorative Technical Detail -->
<div class="flex items-center justify-center gap-xs pt-2xl opacity-20">
<div class="h-[1px] w-8 bg-ink"></div>
<span class="font-mono-eyebrow text-mono-eyebrow">SYSTEM READY</span>
<div class="h-[1px] w-8 bg-ink"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 bg-surface px-xl pb-safe border-t border-hairline z-50">
<!-- Today Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
<span class="font-mono-eyebrow text-mono-eyebrow uppercase mt-1">Today</span>
</a>
<!-- Plan Tab (ACTIVE) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="event_note">event_note</span>
<span class="font-mono-eyebrow text-mono-eyebrow uppercase mt-1">Plan</span>
</a>
<!-- Progress Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="query_stats">query_stats</span>
<span class="font-mono-eyebrow text-mono-eyebrow uppercase mt-1">Progress</span>
</a>
<!-- Profile Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-mono-eyebrow text-mono-eyebrow uppercase mt-1">Profile</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the button
        document.querySelector('button').addEventListener('mousedown', function() {
            this.style.opacity = '0.9';
        });
        document.querySelector('button').addEventListener('mouseup', function() {
            this.style.opacity = '1';
        });

        // Atmospheric fade-in for the illustration
        window.addEventListener('load', () => {
            const img = document.querySelector('img');
            img.style.transition = 'opacity 1s ease-in-out';
            img.style.opacity = '1';
        });
    </script>
</body></html>
