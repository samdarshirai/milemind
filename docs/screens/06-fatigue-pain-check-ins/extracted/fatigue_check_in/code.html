<!-- Navigation suppressed per "Task-Focused" rule in System Instructions -->
<script>
        function selectChip(element, category) {
            // Find all siblings in the same container
            const siblings = element.parentElement.querySelectorAll('button');
            siblings.forEach(sib => {
                sib.classList.remove('selection-active');
                sib.classList.remove('text-on-primary-container');
            });
            // Add active class to clicked element
            element.classList.add('selection-active');
        }

        // Add a subtle scanline effect for technical aesthetic
        const canvas = document.createElement('div');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '100';
        canvas.style.background = 'linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.01), rgba(0, 255, 0, 0.005), rgba(0, 0, 255, 0.01))';
        canvas.style.backgroundSize = '100% 2px, 3px 100%';
        document.body.appendChild(canvas);
    </script>
