<body class="font-body-md text-on-surface">
<!-- Background Content (Simulated Dashboard) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-lg h-16 bg-canvas-dark border-b border-hairline">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-primary">speed</span>
<span class="font-headline-lg text-headline-lg font-black tracking-tighter text-on-primary">MILEMIND</span>
</div>
<div class="flex items-center gap-md">
<span class="font-mono-caps-label text-mono-caps-label text-on-primary/60">together.ai</span>
<button class="material-symbols-outlined text-on-primary hover:opacity-80 transition-opacity">settings</button>
</div>
<div class="gradient-ribbon"></div>
</header>
<main class="pt-24 px-lg pb-section space-y-xl">
<div class="space-y-sm">
<p class="font-mono-eyebrow text-mono-eyebrow text-secondary uppercase">Active Session</p>
<h1 class="font-headline-xl text-headline-xl">Threshold Power Sprints</h1>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="p-lg bg-surface border border-hairline rounded-lg">
<p class="font-mono-caption text-mono-caption text-on-surface-variant uppercase mb-xs">Time Elapsed</p>
<p class="font-headline-lg text-headline-lg">14:22</p>
</div>
<div class="p-lg bg-surface border border-hairline rounded-lg">
<p class="font-mono-caption text-mono-caption text-on-surface-variant uppercase mb-xs">Target Watts</p>
<p class="font-headline-lg text-headline-lg">340w</p>
</div>
</div>
<div class="aspect-video bg-canvas-dark rounded-xl flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-accent-orange via-accent-magenta to-accent-periwinkle opacity-20"></div>
<img alt="Performance Graph" class="w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJBDpS2opXiuBqrm0Uob2Bh2VVefDFuQuh4mTZuEuiHEfYp91sizfqHDsp9q5X_WcRpIFBxu49q0NdR-4H-ZA57M4YhvCBXUB-bbWVW10BJLYm48pHOOnELEO4vAgGhJlI5-Jlq7xDc94M0mg9xSqhL6t5bGbrQXKlkrdPvSxmvcOKvHu3TjTxBWRIfnZ-dLNCZaapSYAzaOk3YFBBmd4ZqtgbiTS2ndueT1T4zpYC-yNK6IKK2VnDfoQbxju-Q3qW-4nxjwg4xUA"/>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-on-primary" style="font-variation-settings: 'FILL' 1;">play_circle</span>
</div>
</div>
<div class="flex flex-col gap-md pt-lg">
<button class="w-full py-md bg-primary text-on-primary font-mono-button text-mono-button rounded-full uppercase tracking-wider">Pause Workout</button>
<button class="w-full py-md border border-hairline text-on-surface font-mono-button text-mono-button rounded-full uppercase tracking-wider hover:bg-surface-container transition-colors" onclick="openBottomSheet()">Skip Today</button>
</div>
</main>
<!-- Bottom Nav Shell -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center h-20 px-md pb-safe bg-surface border-t border-hairline">
<div class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-xl px-4 py-1">
<span class="material-symbols-outlined">calendar_today</span>
<span class="font-mono-caps-label text-mono-caps-label mt-1">Today</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">event_note</span>
<span class="font-mono-caps-label text-mono-caps-label mt-1">Plan</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">insights</span>
<span class="font-mono-caps-label text-mono-caps-label mt-1">Progress</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">person</span>
<span class="font-mono-caps-label text-mono-caps-label mt-1">Profile</span>
</div>
</nav>
<!-- CONFIRMATION BOTTOM SHEET COMPONENT -->
<div class="fixed inset-0 z-[100] bg-black/60 opacity-0 pointer-events-none scrim-fade" id="modalScrim" onclick="closeBottomSheet()"></div>
<div class="fixed bottom-0 left-0 right-0 z-[101] translate-y-full bottom-sheet-transition flex justify-center" id="bottomSheet">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-t-xl shadow-2xl p-lg md:p-2xl">
<!-- Handle -->
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mb-2xl"></div>
<div class="space-y-xl">
<!-- Header -->
<div class="space-y-sm">
<h2 class="font-display-xl text-display-xl tracking-tight text-ink">Skip workout?</h2>
<p class="font-caption text-caption text-on-surface-variant">Your plan may adapt after skipping to keep you on track.</p>
</div>
<!-- Reason List -->
<form class="space-y-sm">
<label class="flex items-center justify-between p-lg bg-surface border border-hairline rounded-sm cursor-pointer hover:bg-surface-container transition-all active:scale-[0.99]">
<span class="font-body-md text-on-surface">Too tired</span>
<input checked="" class="w-5 h-5 border-hairline text-primary focus:ring-0" name="skip-reason" type="radio"/>
</label>
<label class="flex items-center justify-between p-lg bg-surface border border-hairline rounded-sm cursor-pointer hover:bg-surface-container transition-all active:scale-[0.99]">
<span class="font-body-md text-on-surface">Pain/discomfort</span>
<input class="w-5 h-5 border-hairline text-primary focus:ring-0" name="skip-reason" type="radio"/>
</label>
<label class="flex items-center justify-between p-lg bg-surface border border-hairline rounded-sm cursor-pointer hover:bg-surface-container transition-all active:scale-[0.99]">
<span class="font-body-md text-on-surface">No time</span>
<input class="w-5 h-5 border-hairline text-primary focus:ring-0" name="skip-reason" type="radio"/>
</label>
<label class="flex items-center justify-between p-lg bg-surface border border-hairline rounded-sm cursor-pointer hover:bg-surface-container transition-all active:scale-[0.99]">
<span class="font-body-md text-on-surface">Other</span>
<input class="w-5 h-5 border-hairline text-primary focus:ring-0" name="skip-reason" type="radio"/>
</label>
</form>
<!-- Actions -->
<div class="flex flex-col gap-sm pt-md">
<button class="w-full py-md bg-primary text-on-primary font-mono-button text-mono-button rounded-full uppercase tracking-wider active:scale-95 transition-transform" onclick="confirmAction()">
                        CONFIRM SKIP
                    </button>
<button class="w-full py-md bg-transparent text-on-surface font-mono-button text-mono-button rounded-full uppercase tracking-wider border border-hairline hover:bg-surface-container active:scale-95 transition-all" onclick="closeBottomSheet()">
                        CANCEL
                    </button>
</div>
</div>
<!-- Safe Area Spacer for Mobile -->
<div class="h-6"></div>
</div>
</div>
<script>
        function openBottomSheet() {
            const scrim = document.getElementById('modalScrim');
            const sheet = document.getElementById('bottomSheet');
            scrim.classList.remove('opacity-0', 'pointer-events-none');
            scrim.classList.add('opacity-100', 'pointer-events-auto');
            sheet.classList.remove('translate-y-full');
            sheet.classList.add('translate-y-0');
            document.body.style.overflow = 'hidden';
        }

        function closeBottomSheet() {
            const scrim = document.getElementById('modalScrim');
            const sheet = document.getElementById('bottomSheet');
            scrim.classList.add('opacity-0', 'pointer-events-none');
            scrim.classList.remove('opacity-100', 'pointer-events-auto');
            sheet.classList.add('translate-y-full');
            sheet.classList.remove('translate-y-0');
            document.body.style.overflow = '';
        }

        function confirmAction() {
            alert("Workout skipped. Plan recalibrating...");
            closeBottomSheet();
        }
    </script>
</body></html>
