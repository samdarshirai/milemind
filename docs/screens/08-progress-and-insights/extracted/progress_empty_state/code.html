<body class="bg-background text-on-surface font-body-md antialiased overflow-x-hidden">
<!-- Top Navigation Shell -->
<header class="bg-canvas-dark docked full-width top-0 z-40">
<div class="flex flex-col justify-end px-2xl pb-md pt-section w-full">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-accent-orange" style="font-variation-settings: 'FILL' 1;">speed</span>
<span class="font-mono-caps-button text-mono-caps-button text-accent-orange">MileMind</span>
</div>
<div class="flex items-center gap-xl">
<nav class="hidden md:flex items-center gap-xl">
<a class="font-mono-caps-label text-mono-caps-label text-body-grey hover:text-accent-periwinkle transition-colors" href="#">Today</a>
<a class="font-mono-caps-label text-mono-caps-label text-body-grey hover:text-accent-periwinkle transition-colors" href="#">Plan</a>
<a class="font-mono-caps-label text-mono-caps-label text-on-primary hover:text-accent-periwinkle transition-colors" href="#">Progress</a>
<a class="font-mono-caps-label text-mono-caps-label text-body-grey hover:text-accent-periwinkle transition-colors" href="#">Profile</a>
</nav>
<button class="material-symbols-outlined text-on-primary hover:text-accent-periwinkle transition-colors scale-95 transition-transform" data-icon="settings">settings</button>
</div>
</div>
</div>
</header>
<main class="min-h-screen flex flex-col pt-3xl pb-section px-2xl max-w-5xl mx-auto">
<!-- Header Section -->
<section class="mb-section animate-in fade-in slide-in-from-bottom-4 duration-700">
<p class="font-mono-caps-eyebrow text-mono-caps-eyebrow text-body-grey tracking-widest mb-xs">PROGRESS</p>
<h1 class="font-display-lg text-display-lg text-primary">Starting Line</h1>
<div class="h-[1px] w-12 bg-accent-magenta mt-md"></div>
</section>
<!-- Empty State Content -->
<div class="flex-grow flex flex-col items-center justify-center animate-in fade-in slide-in-from-bottom-8 duration-1000 delay-200">
<div class="ex-empty-state-card w-full max-w-md bg-surface-container-lowest border border-outline-variant p-5xl flex flex-col items-center text-center rounded">
<!-- Technical Graphic Element -->
<div class="relative mb-3xl">
<div class="absolute inset-0 bg-accent-periwinkle/10 blur-3xl rounded-full"></div>
<div class="relative w-24 h-24 bg-canvas-dark rounded-full flex items-center justify-center border border-white/10 group overflow-hidden">
<span class="material-symbols-outlined text-on-primary text-5xl transition-transform group-hover:scale-110 duration-500" data-icon="steps">steps</span>
<!-- Decorative scan line -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-accent-magenta/20 to-transparent w-full h-1/2 -top-full animate-[scan_3s_linear_infinite]"></div>
</div>
</div>
<div class="space-y-md">
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">
            Your data will live here. Complete your first run to unlock adherence and readiness insights.
          </p>
<!-- Secondary technical detail -->
<div class="pt-xl flex flex-col items-center gap-xs opacity-40">
<span class="font-mono-caption text-mono-caption uppercase tracking-wider">Awaiting Stream...</span>
<div class="flex gap-1">
<div class="w-1 h-1 bg-primary rounded-full animate-pulse"></div>
<div class="w-1 h-1 bg-primary rounded-full animate-pulse [animation-delay:200ms]"></div>
<div class="w-1 h-1 bg-primary rounded-full animate-pulse [animation-delay:400ms]"></div>
</div>
</div>
</div>
</div>
<!-- CTA Button -->
<div class="mt-4xl">
<button class="bg-primary text-on-primary font-mono-caps-button text-mono-caps-button py-xs px-2xl border border-primary hover:bg-transparent hover:text-primary transition-all active:scale-95 flex items-center gap-sm">
<span>View Today's Plan</span>
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Background Decorative Element (Asymmetric Bento-ish texture) -->
<div class="fixed top-[20%] right-[-5%] w-96 h-96 opacity-[0.03] pointer-events-none select-none">
<img alt="Technical running pattern" class="w-full h-full object-cover rounded-full" data-alt="Close-up of a highly technical running shoe sole with intricate carbon fiber weaving patterns. The image is shot in high-contrast monochrome with sharp white lighting accentuating the textures. The style is ultra-minimalist and architectural reflecting precision engineering and high-performance sports equipment. Cinematic composition with deep shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDerWnsDKH8LiiNm2f66GliUUb7blkaVfNQbEqsXcOyMGwnuhj9lYK_HBPoozDh40YP-p5hpgb1LUyHplQuOEz20Y2qlRj4TrEPm8lF-OrhcIslEf4OtiCA-dQoB7C1AJjlZK_M3ETTe3Hw55VbhK1iwEpZUFVv7yKZeJNJ_8ahYix-ZdFt7kHqBq93tWJJPPlW-NsF8WiYbezle7F8bccD0J_bQLrSr4-09YKDZPWHE1z_ny8oi8t5lFKOnk3-J-ML3rG07AEiy7MJ"/>
</div>
</main>
<!-- Bottom Navigation Shell (Mobile Only) -->
<footer class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface dark:bg-canvas-dark px-lg py-md border-t border-outline-variant">
<a class="flex flex-col items-center justify-center text-body-grey opacity-60 hover:text-accent-magenta transition-all" href="#">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
<span class="font-mono-caps-label text-mono-caps-label">Today</span>
</a>
<a class="flex flex-col items-center justify-center text-body-grey opacity-60 hover:text-accent-magenta transition-all" href="#">
<span class="material-symbols-outlined" data-icon="event_note">event_note</span>
<span class="font-mono-caps-label text-mono-caps-label">Plan</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-on-primary font-bold scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="insights" style="font-variation-settings: 'FILL' 1;">insights</span>
<span class="font-mono-caps-label text-mono-caps-label">Progress</span>
</a>
<a class="flex flex-col items-center justify-center text-body-grey opacity-60 hover:text-accent-magenta transition-all" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-mono-caps-label text-mono-caps-label">Profile</span>
</a>
</footer>
<script>
    // Simple custom animation logic
    const scanLine = document.querySelector('.animate-\\[scan_3s_linear_infinite\\]');
    if (scanLine) {
      const keyframes = [
        { top: '-100%' },
        { top: '100%' }
      ];
      const options = {
        duration: 3000,
        iterations: Infinity
      };
      scanLine.animate(keyframes, options);
    }
  </script>
</body></html>
